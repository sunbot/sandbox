# Builds an installable Android APK in GitHub's cloud and publishes it to a Release you can open on your phone:
#   https://github.com/<owner>/<repo>/releases/tag/android-latest
# Start it from the Actions tab → "Intake Grid Android APK" → Run workflow (optionally paste your server address),
# or it runs when this file changes. No computer and no Google Play needed.
name: Intake Grid Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Your server address, e.g. https://nutriplan-xyz.onrender.com (blank = use repo variable NUTRIPLAN_API_URL, else type it in the app)"
        required: false
        type: string
  push:
    branches: ["**"]
    paths: [".github/workflows/nutriplan-android.yml"]

concurrency:
  group: nutriplan-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # to publish the Release

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: nutriplan/mobile
    env:
      # Baked into the app as its default server. Optional: the app also has a Settings screen for it.
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.NUTRIPLAN_API_URL || 'https://sandbox-pxdy.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nutriplan/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('nutriplan/mobile/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci --no-audit --no-fund

      - name: Version code = run number (so each build installs over the previous one)
        run: |
          node -e "const f='app.json';const a=require('./'+f);a.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);require('fs').writeFileSync(f,JSON.stringify(a,null,2))"

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (64-bit phones)
        working-directory: nutriplan/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/IntakeGrid.apk
          ls -la dist-apk

      - uses: actions/upload-artifact@v4
        with:
          name: IntakeGrid-apk
          path: nutriplan/mobile/dist-apk/IntakeGrid.apk

      - name: Publish Release (stable link for your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest dist-apk/IntakeGrid.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Intake Grid for Android (build ${GITHUB_RUN_NUMBER})" \
            --notes "Open this page on your phone, tap IntakeGrid.apk, install (it updates the app you have) (allow 'install unknown apps' for your browser if asked). Built from ${GITHUB_SHA::7}. Server: ${EXPO_PUBLIC_API_URL:-set in the app under More → Settings}."
